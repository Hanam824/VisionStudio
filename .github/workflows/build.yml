name: Production Release Build

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions dashboard
  push:
    tags:
      - 'v*' # Triggers automatically ONLY when you push a version tag

jobs:
  production-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            preset: ci-windows-x64
            build_preset: ci-windows-x64
          - name: macOS arm64 (Apple Silicon)
            os: macos-latest
            preset: ci-macos-arm64
            build_preset: ci-macos-arm64
          - name: macOS x64 (Intel)
            os: macos-13
            preset: ci-macos-x64
            build_preset: ci-macos-x64
          - name: Linux x64 (.deb)
            os: ubuntu-latest
            preset: ci-linux-deb-x64
            build_preset: ci-linux-deb-x64
          - name: Linux x64 (.rpm)
            os: ubuntu-latest
            preset: ci-linux-rpm-x64
            build_preset: ci-linux-rpm-x64

    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0 # Full history needed for proper release version tagging / changelogs

    - name: Set up MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build cmake pkg-config autoconf autoconf-archive automake libtool \
          libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-x11-dev libxcb-xinerama0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxcb-util-dev libxcb-util0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
          libxcb-render-util0-dev libxcb-sync-dev libx11-dev libxft-dev libxext-dev libwayland-dev libxrender-dev \
          libx11-xcb-dev libxkbcommon-dev python3-setuptools python3-pip gperf bison flex libasound2-dev \
          libharfbuzz-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev libglib2.0-dev libgtk-3-dev libipc-run-perl \
          libltdl-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja cmake pkg-config autoconf autoconf-archive automake libtool libomp

    - name: Bootstrap vcpkg
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./third-party/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        else
          ./third-party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
      shell: bash

    - name: Set up PKG_CONFIG_PATH (Linux)
      if: runner.os == 'Linux'
      run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/lib/pkgconfig" >> $GITHUB_ENV

    # Layer 1: Restore the entire vcpkg_installed directory from cache.
    - name: Cache vcpkg installed packages
      uses: actions/cache@v4
      with:
        path: build/${{ matrix.preset }}/vcpkg_installed
        key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ matrix.preset }}-

    # Layer 2: vcpkg binary caching as a fallback when Layer 1 misses.
    - name: Export GitHub Actions Cache Environment
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Set up vcpkg Binary Caching
      shell: bash
      run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build Production Release Binaries
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Run Tests
      run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure