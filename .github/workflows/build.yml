name: Production Release Build

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions dashboard
    inputs:
      platform:
        description: "Target Platform to Build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - Windows
          - macOS
          - Linux
  push:
    tags:
      - 'v*' # Triggers automatically ONLY when you push a version tag

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            preset: ci-windows-x64
            build_preset: ci-windows-x64
          - name: macOS arm64 (Apple Silicon)
            os: macos-latest
            preset: ci-macos-arm64
            build_preset: ci-macos-arm64
          - name: macOS x64 (Intel)
            os: macos-26-intel
            preset: ci-macos-x64
            build_preset: ci-macos-x64
          - name: Linux x64
            os: ubuntu-latest
            preset: ci-linux-x64
            build_preset: ci-linux-x64

    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      (github.event.inputs.platform == 'Windows' && matrix.os == 'windows-latest') ||
      (github.event.inputs.platform == 'macOS' && startsWith(matrix.os, 'macos')) ||
      (github.event.inputs.platform == 'Linux' && matrix.os == 'ubuntu-latest')
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_FORCE_SYSTEM_BINARIES: "0"
      VCPKG_KEEP_ENV_VARS: "PKG_CONFIG_PATH"

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: recursive
        fetch-depth: 0 # Full history needed for proper release version tagging / changelogs

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Set up MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b205dc5016bfb77624c16d145a9955e30002228 # v1.13.0
      with:
        arch: x64

    - name: Install Inno Setup (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install innosetup -y
        echo "C:\Program Files (x86)\Inno Setup 6" >> $GITHUB_PATH

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build cmake pkg-config autoconf autoconf-archive automake libtool \
          libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libxkbcommon-x11-dev libx11-xcb-dev \
          libxcb1-dev libxcb-xinput-dev libxcb-xkb-dev libxcb-cursor-dev libxcb-util-dev libxcb-keysyms1-dev \
          libxcb-image0-dev libxcb-icccm4-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-shape0-dev \
          libxcb-xfixes0-dev libxcb-randr0-dev libxcb-sync-dev libxcb-shm0-dev libxcb-render0-dev libxcb-glx0-dev \
          libx11-dev libxft-dev libxext-dev libwayland-dev libxrender-dev python3-setuptools python3-pip gperf bison flex libasound2-dev \
          libharfbuzz-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev libglib2.0-dev libgtk-3-dev libipc-run-perl \
          libltdl-dev libxi-dev libxcursor-dev libxfixes-dev libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
          libxrandr-dev libxinerama-dev libxcomposite-dev libxtst-dev libsm-dev libice-dev libxkbcommon-dev rpm

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja cmake pkg-config autoconf autoconf-archive automake libtool libomp

    - name: Bootstrap vcpkg
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./third-party/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        else
          ./third-party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
      shell: bash

    - name: Set up PKG_CONFIG_PATH (Linux)
      if: runner.os == 'Linux'
      run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/lib/pkgconfig" >> $GITHUB_ENV

    # Layer 1: Restore the entire vcpkg_installed directory from cache.
    - name: Cache vcpkg installed packages
      uses: actions/cache@1bd1e21d3af02a28e21bd9603fc055c7a68b31c1 # v4.2.0
      with:
        path: build/${{ matrix.preset }}/vcpkg_installed
        key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ matrix.preset }}-

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build Production Release Binaries
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Upload vcpkg build logs on failure
      if: failure()
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45b530 # v4.6.0
      with:
        name: vcpkg-logs-${{ matrix.preset }}
        path: |
          third-party/vcpkg/buildtrees/**/*.log
          third-party/vcpkg/buildtrees/**/*.yaml
          third-party/vcpkg/buildtrees/**/*.txt

    - name: Run Tests
      run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

    - name: Package Release (Linux)
      if: runner.os == 'Linux'
      working-directory: build/${{ matrix.preset }}
      run: cpack -G "DEB;RPM;TGZ"

    - name: Package Release (Windows/macOS)
      if: runner.os != 'Linux'
      working-directory: build/${{ matrix.preset }}
      run: cpack

    - name: Print Inno Setup Log on Failure
      if: failure() && runner.os == 'Windows'
      working-directory: build/${{ matrix.preset }}
      run: |
        if (Test-Path "_CPack_Packages/win64/INNOSETUP/ISCCOutput.log") {
          Write-Host "=== ISCCOutput.log ==="
          Get-Content "_CPack_Packages/win64/INNOSETUP/ISCCOutput.log"
        } else {
          Write-Host "ISCCOutput.log not found."
        }
      shell: powershell


    - name: Upload Artifacts
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45b530 # v4.6.0
      with:
        name: VisionStudio-${{ matrix.preset }}
        path: |
          build/${{ matrix.preset }}/bin/
          build/${{ matrix.preset }}/*.deb
          build/${{ matrix.preset }}/*.rpm
          build/${{ matrix.preset }}/*.dmg
          build/${{ matrix.preset }}/*.exe
          build/${{ matrix.preset }}/*.zip
          build/${{ matrix.preset }}/*.tar.gz

  publish-release:
    needs: production-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372ec862e1e # v4.1.8
      with:
        path: artifacts

    - name: List downloaded files for debugging
      run: ls -R artifacts

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@c8624341054c25964f598bd254c0df98b5a03673 # v2.2.0
      with:
        files: |
          artifacts/**/*.deb
          artifacts/**/*.rpm
          artifacts/**/*.dmg
          artifacts/**/*.exe
          artifacts/**/*.zip
          artifacts/**/*.tar.gz
        draft: false
        prerelease: false