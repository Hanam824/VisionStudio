name: Build Vision Studio

on:
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI
  push:
    tags:
      - 'v*' # Triggers automatically ONLY when you push a version tag (e.g. git tag v1.0.0)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            preset: windows-x64
            build_preset: windows-x64
          - os: macos-latest
            preset: macos-arm64
            build_preset: macos-arm64
          - os: ubuntu-latest
            preset: linux-deb-x64
            build_preset: linux-deb-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build cmake pkg-config autoconf autoconf-archive automake libtool \
          libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-x11-dev libxcb-xinerama0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxcb-util-dev libxcb-util0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
          libxcb-render-util0-dev libxcb-sync-dev libx11-dev libxft-dev libxext-dev libwayland-dev libxrender-dev \
          libx11-xcb-dev libxkbcommon-dev python3-setuptools python3-pip gperf bison flex libasound2-dev \
          libharfbuzz-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev libglib2.0-dev libgtk-3-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja cmake pkg-config autoconf autoconf-archive automake libtool libomp

    - name: Bootstrap vcpkg
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./third-party/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        else
          ./third-party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
      shell: bash

    - name: Set up PKG_CONFIG_PATH (Linux)
      if: runner.os == 'Linux'
      run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/lib/pkgconfig" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build CMake
      run: cmake --build --preset ${{ matrix.build_preset }} --parallel

    - name: Run Tests
      run: |
        ctest --test-dir build/${{ matrix.preset }} --build-config Release --output-on-failure
